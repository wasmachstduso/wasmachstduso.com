<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>schreiben</title>
  <link rel="stylesheet" href="https://use.typekit.net/vya7gle.css" />
  <link rel="stylesheet" href="./assets/css/style.css" />
  <link rel="icon" href="./favicon.png" />
  <style>
    .wrap { width: 100%; max-width: 700px; padding: 0 20px; box-sizing: border-box; margin: 0 auto; }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .field label { font-family: noto-sans, sans-serif; font-size: 14px; color: #757575; }
    .field input, .field textarea, .field select {
      font-family: noto-sans, sans-serif; font-size: 16px; padding: 10px 12px;
      border: 1px solid rgba(0,0,0,0.25); border-radius: 8px;
      background: rgba(255,255,255,0.45); box-sizing: border-box; width: 100%;
    }
    .field textarea { resize: vertical; line-height: 1.5; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .row .field { flex: 1; min-width: 180px; }
    .actions { display: flex; gap: 10px; margin: 1rem 0; flex-wrap: wrap; align-items: center; }
    .msg { font-family: noto-sans, sans-serif; font-size: 14px; margin: 8px 0; }
    .msg.ok { color: #52c134; } .msg.err { color: #8B0000; }
    .thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .thumbs figure { width: 90px; margin: 0; }
    .thumbs img { width: 100%; border-radius: 6px; }
    .thumbs figcaption { font-size: 10px; color: #757575; }
    .preview { border-top: 1px solid #5252527b; margin-top: 1.5rem; padding-top: 1rem; }
    .filelabel { cursor: pointer; }
    .mode-bar { display: flex; gap: 10px; margin-bottom: 1.5rem; }
    .mode-btn { opacity: 0.4; }
    .mode-btn.active { opacity: 1; }
  </style>
</head>
<body>
  <div class="wrap">
    <h3>schreiben</h3>

    <!-- login -->
    <div id="login">
      <div class="field">
        <label>Passwort</label>
        <input id="pw" type="password" autocomplete="current-password" />
      </div>
      <div id="login-msg" class="msg err" style="display:none">Falsches Passwort.</div>
      <button class="like-button" id="login-btn">einloggen</button>
      <div class="footer"><a class="style4" href="/">zurück</a></div>
    </div>

    <!-- editor -->
    <div id="editor" style="display:none">

      <!-- new / edit toggle -->
      <div class="mode-bar">
        <button class="like-button mode-btn active" id="mode-new">✏️ neu</button>
        <button class="like-button mode-btn" id="mode-edit">📝 bearbeiten</button>
      </div>

      <!-- post picker (edit mode only) -->
      <div id="picker" class="field" style="display:none">
        <label>Beitrag auswählen</label>
        <select id="post-select">
          <option value="">— bitte wählen —</option>
        </select>
      </div>

      <div class="row">
        <div class="field"><label>Titel</label><input id="title" /></div>
        <div class="field"><label>Autor:in</label><input id="author" /></div>
      </div>
      <div class="field"><label>Datum (wie es angezeigt wird)</label><input id="date" /></div>
      <div class="field">
        <label>Text — HTML erlaubt (&lt;p&gt;…&lt;/p&gt; &lt;br&gt;)</label>
        <div id="dropzone" style="position:relative">
          <textarea id="body" rows="12" placeholder="<p>Hallo …</p>"></textarea>
          <div id="drop-overlay" style="display:none;position:absolute;inset:0;border-radius:8px;border:2px dashed #757575;background:rgba(255,255,255,0.7);align-items:center;justify-content:center;font-family:noto-sans,sans-serif;font-size:14px;color:#757575;pointer-events:none">
            Fotos hier ablegen
          </div>
        </div>
      </div>

      <div class="actions">
        <label class="like-button filelabel">📷 Bilder hinzufügen
          <input id="files" type="file" accept="image/*" multiple style="display:none" />
        </label>
        <button class="like-button" id="para-btn" type="button">¶ Absatz</button>
        <button class="like-button" id="publish-btn" type="button">💾 veröffentlichen</button>
        <button class="like-button" id="new-btn" type="button" style="display:none">+ neuer beitrag</button>
        <button class="like-button" id="delete-btn" type="button" style="display:none">🗑️ löschen</button>
        <button class="like-button" id="logout-btn" type="button">ausloggen</button>
      </div>

      <div id="msg" class="msg"></div>
      <div id="thumbs" class="thumbs"></div>

      <div class="preview">
        <p style="font-size:14px;color:#757575">Vorschau</p>
        <h1 id="pv-title"></h1>
        <p><strong id="pv-author"></strong> am <em id="pv-date"></em></p>
        <div class="post-content" id="pv-body"></div>
      </div>
    </div>
  </div>

  <script>
    const API = (location.hostname === "localhost" || location.hostname === "127.0.0.1")
      ? "http://localhost:8787/api"
      : "/api";
    const MAX_EDGE = 1600;
    const JPEG_QUALITY = 0.82;

    let pw = sessionStorage.getItem("wmds_pw") || "";
    let postId = "";
    let cover = "";
    let editMode = false;

    const $ = (id) => document.getElementById(id);

    // ---- login ----
    if (pw) showEditor();

    $("login-btn").onclick = () => {
      pw = $("pw").value;
      sessionStorage.setItem("wmds_pw", pw);
      showEditor();
    };
    $("logout-btn").onclick = () => { sessionStorage.removeItem("wmds_pw"); location.reload(); };

    function showEditor() {
      $("login").style.display = "none";
      $("editor").style.display = "block";
      if (!$("date").value) $("date").value = todayDE();
      refreshPreview();
    }

    // ---- mode toggle ----
    $("mode-new").onclick = () => switchMode(false);
    $("mode-edit").onclick = () => {
      switchMode(true);
      loadPostList();
    };

    function switchMode(toEdit) {
      editMode = toEdit;
      $("mode-new").classList.toggle("active", !toEdit);
      $("mode-edit").classList.toggle("active", toEdit);
      $("picker").style.display = toEdit ? "block" : "none";
      $("new-btn").style.display = toEdit ? "inline-flex" : "none";
      $("delete-btn").style.display = toEdit ? "inline-flex" : "none";
      if (!toEdit) resetForm();
    }

    // ---- post list for edit mode ----
    async function loadPostList() {
      try {
        const res = await fetch(`${API}/posts`);
        const posts = await res.json();
        const sel = $("post-select");
        sel.innerHTML = '<option value="">— bitte wählen —</option>';
        posts.forEach((p) => {
          const opt = document.createElement("option");
          opt.value = p.id;
          opt.textContent = `${p.date} — ${p.title}`;
          sel.appendChild(opt);
        });
      } catch {
        setMsg("err", "Konnte Beitragsliste nicht laden.");
      }
    }

    $("post-select").onchange = async () => {
      const id = $("post-select").value;
      if (!id) { resetForm(); return; }
      setMsg("", "");
      try {
        const res = await fetch(`${API}/posts/${encodeURIComponent(id)}`);
        if (!res.ok) throw new Error();
        const post = await res.json();
        postId = post.id;
        cover = post.cover_image || "";
        $("title").value = post.title;
        $("author").value = post.author;
        $("date").value = post.date;
        $("body").value = post.body_html;
        $("thumbs").innerHTML = "";
        refreshPreview();
        setMsg("ok", `„${post.title}" geladen — Änderungen und dann veröffentlichen.`);
      } catch {
        setMsg("err", "Beitrag konnte nicht geladen werden.");
      }
    };

    // ---- new post button (while in edit mode) ----
    $("new-btn").onclick = () => {
      $("post-select").value = "";
      resetForm();
      setMsg("", "");
    };

    $("delete-btn").onclick = async () => {
      if (!postId) return;
      const title = $("title").value || postId;
      if (!confirm(`„${title}" wirklich löschen? Das kann nicht rückgängig gemacht werden.`)) return;
      try {
        const r = await fetch(`${API}/admin/posts/${encodeURIComponent(postId)}`, {
          method: "DELETE",
          headers: { Authorization: `Bearer ${pw}` },
        });
        if (r.status === 401) throw new Error("Falsches Passwort.");
        if (!r.ok) throw new Error(await r.text());
        setMsg("ok", `„${title}" gelöscht.`);
        resetForm();
        loadPostList();
      } catch (err) {
        setMsg("err", err.message);
      }
    };

    function resetForm() {
      postId = ""; cover = "";
      $("title").value = "";
      $("author").value = "";
      $("date").value = todayDE();
      $("body").value = "";
      $("thumbs").innerHTML = "";
      refreshPreview();
    }

    // ---- editor ----
    $("para-btn").onclick = () => {
      const t = $("body");
      t.value += (t.value ? "\n" : "") + "<p>\n  \n</p> <br>\n";
      refreshPreview();
    };
    $("body").addEventListener("input", refreshPreview);
    $("title").addEventListener("input", refreshPreview);
    $("author").addEventListener("input", refreshPreview);
    $("date").addEventListener("input", refreshPreview);

    function refreshPreview() {
      $("pv-title").textContent = $("title").value || "(Titel)";
      $("pv-author").textContent = "von " + ($("author").value || "…");
      $("pv-date").textContent = $("date").value || "";
      $("pv-body").innerHTML = $("body").value;
    }

    function todayDE() {
      const days = ["sonntag","montag","dienstag","mittwoch","donnerstag","freitag","samstag"];
      const months = ["januar","februar","märz","april","mai","juni","juli","august","september","oktober","november","dezember"];
      const d = new Date();
      return `${days[d.getDay()]}, ${d.getDate()}. ${months[d.getMonth()]} ${d.getFullYear()}`;
    }

    // ---- image resize + upload ----
    function resizeImage(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const reader = new FileReader();
        reader.onload = () => { img.src = reader.result; };
        reader.onerror = reject;
        img.onload = () => {
          let { width: w, height: h } = img;
          if (Math.max(w, h) > MAX_EDGE) {
            const s = MAX_EDGE / Math.max(w, h);
            w = Math.round(w * s); h = Math.round(h * s);
          }
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          canvas.toBlob((blob) => resolve(blob), "image/jpeg", JPEG_QUALITY);
        };
        img.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function ensurePost(draft = false) {
      const title = $("title").value.trim();
      const author = $("author").value.trim();
      if (!title || !author) throw new Error("Titel und Autor:in zuerst ausfüllen.");
      const res = await fetch(`${API}/admin/posts`, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${pw}` },
        body: JSON.stringify({
          id: postId || undefined,
          title, author,
          date: $("date").value,
          body_html: $("body").value,
          cover_image: cover,
          draft,
        }),
      });
      if (res.status === 401) throw new Error("Falsches Passwort — bitte neu einloggen.");
      if (!res.ok) throw new Error(await res.text());
      const data = await res.json();
      postId = data.id;
      return data.id;
    }

    $("files").onchange = async (e) => {
      const files = Array.from(e.target.files || []);
      if (!files.length) return;
      setMsg("", "");
      try {
        const id = await ensurePost(true);
        for (const file of files) {
          const blob = await resizeImage(file);
          const name = file.name.replace(/\.[^.]+$/, "") + ".jpg";
          const r = await fetch(`${API}/admin/upload?post=${encodeURIComponent(id)}`, {
            method: "POST",
            headers: { "Content-Type": "image/jpeg", "X-Filename": name, Authorization: `Bearer ${pw}` },
            body: blob,
          });
          if (!r.ok) throw new Error(await r.text());
          const { url } = await r.json();
          const tag = `<img class="post-img" loading="lazy" src="${url}">`;
          $("body").value += ($("body").value ? "\n" : "") + tag + "\n";
          if (!cover) cover = url;
          addThumb(url, blob.size, file.size);
        }
        refreshPreview();
        setMsg("ok", "Bilder verkleinert, hochgeladen und eingefügt.");
      } catch (err) {
        setMsg("err", err.message);
      } finally {
        e.target.value = "";
      }
    };

    $("publish-btn").onclick = async () => {
      setMsg("", "");
      try {
        const id = await ensurePost();
        setMsg("ok", `Veröffentlicht ✓  → <a href="/post.html?id=${id}" class="style4">ansehen</a>`);
        // update dropdown if in edit mode
        if (editMode) loadPostList();
      } catch (err) {
        setMsg("err", err.message);
      }
    };

    // ---- drag and drop ----
    const dropzone = $("dropzone");
    const overlay = $("drop-overlay");

    dropzone.addEventListener("dragenter", (e) => { e.preventDefault(); overlay.style.display = "flex"; });
    dropzone.addEventListener("dragover",  (e) => { e.preventDefault(); overlay.style.display = "flex"; });
    dropzone.addEventListener("dragleave", (e) => { if (!dropzone.contains(e.relatedTarget)) overlay.style.display = "none"; });
    dropzone.addEventListener("drop", async (e) => {
      e.preventDefault();
      overlay.style.display = "none";
      const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith("image/"));
      if (!files.length) return;
      setMsg("", "");
      try {
        const id = await ensurePost(true);
        for (const file of files) {
          const blob = await resizeImage(file);
          const name = file.name.replace(/\.[^.]+$/, "") + ".jpg";
          const r = await fetch(`${API}/admin/upload?post=${encodeURIComponent(id)}`, {
            method: "POST",
            headers: { "Content-Type": "image/jpeg", "X-Filename": name, Authorization: `Bearer ${pw}` },
            body: blob,
          });
          if (!r.ok) throw new Error(await r.text());
          const { url } = await r.json();
          const tag = `<img class="post-img" loading="lazy" src="${url}">`;
          $("body").value += ($("body").value ? "\n" : "") + tag + "\n";
          if (!cover) cover = url;
          addThumb(url, blob.size, file.size);
        }
        refreshPreview();
        setMsg("ok", "Bilder verkleinert, hochgeladen und eingefügt.");
      } catch (err) {
        setMsg("err", err.message);
      }
    });

    function addThumb(url, kb, origBytes) {
      const fig = document.createElement("figure");
      fig.innerHTML = `<img src="${url}"><figcaption>${Math.round(kb/1024)} KB (war ${(origBytes/1048576).toFixed(1)} MB)<br><a href="#" class="style4" style="font-size:10px">als Cover</a></figcaption>`;
      fig.querySelector("a").onclick = (e) => {
        e.preventDefault();
        cover = url;
        document.querySelectorAll("#thumbs figure").forEach(f => f.style.outline = "none");
        fig.style.outline = "2px solid #52c134";
        setMsg("ok", "Cover gesetzt.");
      };
      $("thumbs").appendChild(fig);
    }
    function setMsg(kind, text) {
      const m = $("msg");
      m.className = "msg " + kind;
      m.innerHTML = text;
    }
  </script>
</body>
</html>
